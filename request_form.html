{% extends "base.html" %}{% block content %}<section class="card"><h1>Student equipment request</h1><p class="muted">Choose quantities. This request is not approved until the assistant allocates equipment.</p><form method="post"><label for="student_name">Student name or demo label</label><input id="student_name" name="student_name" maxlength="80" required placeholder="e.g. Student A">
<div class="grid">{% for c in categories %}<div class="stat"><label for="qty_{{ c }}"> {{ c }} </label><input class="qty" id="qty_{{ c }}" name="qty_{{ c }}" type="number" min="0" max="20" value="0"></div>{% endfor %}</div><p><button type="submit">Generate request QR</button></p></form></section>{% endblock %}

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECE Lab Guardian</title><style>
:root{--navy:#10243a;--blue:#1d4ed8;--bg:#f3f6fb;--ink:#172033;--muted:#667085;--line:#dbe3ef}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--navy);color:white;padding:16px 20px}header .wrap{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:white;text-decoration:none;margin-left:12px;font-size:14px}.brand{font-weight:800;font-size:18px}main{max-width:1050px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #1d355710}.hero{padding:26px}.muted{color:var(--muted)}.btn,button{display:inline-block;background:var(--blue);color:white;border:0;border-radius:10px;padding:11px 15px;text-decoration:none;font-weight:700;cursor:pointer}.secondary{background:#e8eef9;color:#19365f}.danger{background:#b42318}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:24px;margin-top:6px}label{display:block;font-weight:700;margin:12px 0 6px}input,select{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:9px;width:100%;background:white}input[type=checkbox]{width:auto}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.flash{padding:12px;border-radius:10px;margin-bottom:12px;background:#e6f8ed}.error{background:#fff0ef}.pill{padding:5px 9px;border-radius:999px;background:#e8eef9;font-size:12px;font-weight:700}.available{background:#dcfae6}.borrowed{background:#fff0c2}.overdue,.faulty{background:#ffe1df}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}th{background:#f7f9fc}.qr{width:220px;max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px}.qty{max-width:130px}footer{text-align:center;color:var(--muted);padding:20px;font-size:12px}
</style></head><body><header><div class="wrap"><a class="brand" href="/">ECE LAB GUARDIAN</a><nav><a href="/request">Student Request</a><a href="/assistant">Assistant</a></nav></div></header><main>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ 'error' if category=='error' else '' }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main><footer>Prototype • Sample inventory • ESP32 LED is simulated only</footer></body></html>
